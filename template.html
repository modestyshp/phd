<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Hunter – ELT & Digital Tech</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d2320;--mu:#667069;--ac:#0f766e;--bd:#e2e0d8;--red:#b91c1c;--am:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#121615;--card:#1b211f;--tx:#e8ece9;--mu:#9aa6a0;--ac:#2dd4bf;--bd:#2b3330;--red:#f87171;--am:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:18px 0 6px}.m{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0}@media(max-width:560px){.g{grid-template-columns:1fr}}
input,select{width:100%;padding:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{padding:7px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;cursor:pointer;font:inherit}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
a{color:var(--ac);font-weight:600;text-decoration:none}.tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mu)}
.ok{background:var(--ac);color:#fff;border-color:var(--ac)}.red{color:var(--red)}.am{color:var(--am)}
.u a{display:inline-block;margin:2px 10px 2px 0;font-weight:500}
</style></head><body><main>
<h1>PhD Hunter 🎓</h1><div class="m" id="up"></div>
<nav id="nav"></nav>
<div class="g"><input id="q" placeholder="Search…" oninput="r()"><select id="c" onchange="r()"></select><select id="f" onchange="r()"></select></div>
<div id="l"></div>
<details class="c"><summary>Collector log (which sources worked)</summary><pre class="m" id="lg" style="white-space:pre-wrap"></pre></details>
</main><script>
const D=/*DATA*/null;
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='prog';const now=new Date(new Date().toDateString());
$('up').textContent='Updated '+D.updated+' · '+D.items.length+' auto-found · '+D.programmes.length+' programmes';
$('lg').textContent=D.log.join('\n');
const days=d=>d?Math.ceil((new Date(d)-now)/864e5):null;
const dl=d=>{const n=days(d);return n===null?'':'<span class="'+(n<=14?'red':n<=30?'am':'m')+'">'+n+' days left · '+d+'</span>'};
function fill(){const src=tab==='prog'?D.programmes:tab==='found'?D.items:[];
 const cs=tab==='uni'?Object.keys(D.watch):[...new Set(src.map(o=>o.country))].sort();
 $('c').innerHTML='<option value="">All countries</option>'+cs.map(x=>'<option>'+E(x)+'</option>').join('');
 const fs=[...new Set(src.map(o=>o.type||o.fund))];$('f').innerHTML='<option value="">All funding types</option>'+fs.map(x=>'<option>'+E(x)+'</option>').join('');
 $('f').style.display=tab==='uni'||tab==='links'?'none':'';$('c').style.display=tab==='links'?'none':''}
function tabs(){$('nav').innerHTML=[['prog','Programmes by country'],['found','Auto-found'],['uni','Universities'],['links','Search links']].map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';fill();tabs();r()">${v}</button>`).join('')}
function r(){const q=$('q').value.toLowerCase(),c=$('c').value,f=$('f').value;let h='';
 if(tab==='prog'){const a=D.programmes.filter(o=>(!q||JSON.stringify(o).toLowerCase().includes(q))&&(!c||o.country===c)&&(!f||o.type===f))
  .sort((x,y)=>(x.deadline||'9')>(y.deadline||'9')?1:-1);
  h=a.map(o=>`<div class="c"><a href="${E(o.link)}" target="_blank" rel="noopener">${E(o.name)}</a> <span class="tag">${E(o.country)}</span> <span class="tag">${E(o.type)}</span> ${o.verified?'<span class="tag ok">checked</span>':o.deadline?'<span class="tag">date from one site, confirm</span>':'<span class="tag">typical window, verify</span>'}
  <div class="m">${E(o.window)}</div><div>${dl(o.deadline)}</div><div class="m">${E(o.note)}</div></div>`).join('')}
 if(tab==='found'){const a=D.items.filter(o=>(!q||(o.title+o.source).toLowerCase().includes(q))&&(!c||o.country===c)&&(!f||o.fund===f)).sort((x,y)=>(x.deadline||'9')>(y.deadline||'9')?1:-1);
  h=a.map(o=>{const nw=(now-new Date(o.first_seen))/864e5<=3;return`<div class="c"><a href="${E(o.link)}" target="_blank" rel="noopener">${E(o.title)}</a><div class="m">${E(o.country)} · ${E(o.source)}</div><span class="tag">${E(o.fund)}</span> ${nw?'<span class="tag ok">new</span>':''} ${o.deadline?dl(o.deadline):'<span class="m">deadline: open page to check</span>'}</div>`}).join('')||'<div class="c m">Nothing found yet. Check the log below.</div>'}
 if(tab==='uni'){for(const [k,v] of Object.entries(D.watch)){if(c&&k!==c)continue;
  h+='<h2>'+E(k)+'</h2><div class="c u">'+v.filter(u=>!q||u[0].toLowerCase().includes(q)).map(u=>{const s='site:'+u[1]+' PhD (linguistics OR "language education" OR "educational technology") funding';
  return`<a href="https://www.google.com/search?q=${encodeURIComponent(s)}" target="_blank" rel="noopener">${E(u[0])}</a>`}).join('')+'</div>'}
  h='<div class="m">Each link runs a ready-made search of that university for PhD funding in your field.</div>'+h}
 if(tab==='links'){const B=[['EURAXESS (Europe)','euraxess.ec.europa.eu'],['EURAXESS Belgium','euraxess.be'],['FindAPhD','findaphd.com'],['Academic Positions','academicpositions.com'],['PhDportal','phdportal.com'],['ScholarshipDB','scholarshipdb.net'],['Campus France','campusfrance.org'],['ABG (France)','abg.asso.fr'],['Jobbnorge (Nordics)','jobbnorge.no'],['MEXT Japan','studyinjapan.go.jp'],['AUF','auf.org'],['AcademicTransfer (NL)','academictransfer.com'],['academics.de (Germany)','academics.de']];
 const K=['applied linguistics','language education','educational technology','TESOL','CALL language learning','digital learning'];
 h='<div class="m">These sites block automatic search, so open each in your own browser. Each link searches that site for one keyword.</div>'+B.map(b=>'<h2>'+E(b[0])+'</h2><div class="c u">'+K.filter(k=>!q||k.toLowerCase().includes(q)||b[0].toLowerCase().includes(q)).map(k=>'<a href="https://www.google.com/search?q='+encodeURIComponent('site:'+b[1]+' '+k+' PhD (funded OR scholarship OR position)')+'" target="_blank" rel="noopener">'+E(k)+'</a>').join('')+'</div>').join('')}
 $('l').innerHTML=h||'<div class="c m">No matches.</div>'}
fill();tabs();r();
</script></body></html>
